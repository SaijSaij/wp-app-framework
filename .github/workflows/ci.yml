# Tests and lint of the framework (PHPUnit, Vitest, PHPStan, PHP-CS-Fixer, ESLint,
# Stylelint) in the tools container of wp-dev-env, and the build of the documentation
# (docs/). Also run by release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wp-app-framework
        uses: actions/checkout@v5
        with:
          path: workspace/wp-app-framework

      - name: Check out wp-dev-env
        uses: actions/checkout@v5
        with:
          repository: SaijSaij/wp-dev-env
          path: workspace/wp-dev-env

      - name: Configure wp-dev-env
        working-directory: workspace/wp-dev-env
        run: |
          cp .env.example .env
          sed -i "s|^HOST_UID=.*|HOST_UID=$(id -u)|; s|^HOST_GID=.*|HOST_GID=$(id -g)|" .env
          docker compose build tools

      - name: Install, test and lint
        working-directory: workspace/wp-dev-env
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          docker compose run --rm -e COMPOSER_AUTH -w /workspace/wp-app-framework tools sh -euc "
            composer install --no-interaction --no-progress
            composer test
            composer lint
            npm ci --no-audit --no-fund
            npm test
            npm --prefix docs ci --no-audit --no-fund
            npm run lint
          "

  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wp-app-framework
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build the documentation (fails on broken links and anchors)
        working-directory: docs
        env:
          DOCS_BASE: /wp-app-framework/next/
        run: |
          npm ci --no-audit --no-fund
          npm run build
