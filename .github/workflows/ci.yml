# Tests and lint of the framework (PHPUnit, Vitest, PHPStan, PHP-CS-Fixer, ESLint,
# Stylelint) in the tools image of wp-test-env, and the build of the documentation
# (docs/). Also run by release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wp-app-framework
        uses: actions/checkout@v5
        with:
          path: workspace/wp-app-framework

      - name: Check out wp-test-env
        uses: actions/checkout@v5
        with:
          repository: SaijSaij/wp-test-env
          path: workspace/wp-test-env

      - name: Build the tools image
        working-directory: workspace/wp-test-env
        run: bin/build tools

      - name: Install, test and lint
        working-directory: workspace/wp-test-env
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
        run: |
          bin/tools -e COMPOSER_AUTH -w wp-app-framework sh -euc "
            composer install --no-interaction --no-progress
            composer test
            composer lint
            npm ci --no-audit --no-fund
            npm test
            npm --prefix docs ci --no-audit --no-fund
            npm run lint
          "

  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out wp-app-framework
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build the documentation (fails on broken links and anchors)
        working-directory: docs
        env:
          DOCS_BASE: /wp-app-framework/next/
        run: |
          npm ci --no-audit --no-fund
          npm run build
