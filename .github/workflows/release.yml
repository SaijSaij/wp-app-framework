# Release of the framework for a tag v<version>: tests and lint and, at the same
# time, the release gates – the test theme theme-dev-test, the test plugin
# plugin-dev-test and the test child theme theme-dev-test-child are built with the
# framework of the tag,
# installed into a plain WordPress and tested in the browser; the plugin and the
# child theme with a theme release, so two framework versions run side by side;
# and a theme, child theme and plugin created from wp-app-starter with every option –
# and only then the GitHub release with the package ZIP (distribution files, see
# .gitattributes) and the documentation of the tag's minor version on gh-pages.
# If a check or a gate fails, the tag is deleted, so the same version can be tagged
# again once the cause is fixed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  gate:
    uses: ./.github/workflows/consumer-release.yml
    permissions:
      contents: write
    with:
      repository: SaijSaij/theme-dev-test
      ref: main
      framework-ref: ${{ github.ref }}
      cli: true
      publish: false

  gate-plugin:
    uses: ./.github/workflows/consumer-release.yml
    permissions:
      contents: write
    with:
      repository: SaijSaij/plugin-dev-test
      ref: main
      framework-ref: ${{ github.ref }}
      cli: true
      with-theme: SaijSaij/theme-dev-test@v0.1.0
      publish: false

  gate-child-theme:
    uses: ./.github/workflows/consumer-release.yml
    permissions:
      contents: write
    with:
      repository: SaijSaij/theme-dev-test-child
      ref: main
      framework-ref: ${{ github.ref }}
      with-theme: SaijSaij/theme-dev-test@v0.3.0
      publish: false

  gate-starter:
    uses: SaijSaij/wp-app-starter/.github/workflows/ci.yml@main
    with:
      starter-ref: main
      framework-ref: ${{ github.ref }}

  publish:
    needs: [checks, gate, gate-plugin, gate-child-theme, gate-starter]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?)$ ]]; then
            echo "::error::Releases are built from tags v<semantic version>, got ${TAG}."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Check out wp-app-framework
        uses: actions/checkout@v5

      - name: Build the package ZIP and attach it to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          zip="wp-app-framework-${VERSION}.zip"
          git archive --format=zip --prefix=wp-app-framework/ --output="${zip}" "${TAG}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${zip}" --clobber
          else
            gh release create "${TAG}" "${zip}" --verify-tag --title "${TAG}" --generate-notes
          fi

  docs:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Shared with docs.yml: one push to gh-pages at a time.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Determine the documentation version
        id: docs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${TAG} is a pre-release; its documentation is not published."
          fi

      - name: Check out wp-app-framework
        if: steps.docs.outputs.version != ''
        uses: actions/checkout@v5
        with:
          path: workspace/wp-app-framework

      - name: Check out wp-test-env
        if: steps.docs.outputs.version != ''
        uses: actions/checkout@v5
        with:
          repository: SaijSaij/wp-test-env
          path: workspace/wp-test-env

      - name: Build the tools image
        if: steps.docs.outputs.version != ''
        working-directory: workspace/wp-test-env
        run: bin/build tools

      # The API reference is generated from the code (tools/api-reference, tools/api-reference-js.mjs), so the
      # documentation is built in the tools image with PHP, Composer and the npm packages of the framework.
      - name: Build the documentation
        if: steps.docs.outputs.version != ''
        working-directory: workspace/wp-test-env
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
          DOCS_BASE: /wp-app-framework/${{ steps.docs.outputs.version }}/
        run: |
          bin/tools -e COMPOSER_AUTH -e DOCS_BASE -e CI -w wp-app-framework sh -euc "
            composer install --no-interaction --no-progress
            npm ci --no-audit --no-fund
            npm --prefix docs ci --no-audit --no-fund
            npm --prefix docs run build
          "

      - name: Set up Node
        if: steps.docs.outputs.version != ''
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Publish to gh-pages
        if: steps.docs.outputs.version != ''
        working-directory: workspace/wp-app-framework/docs
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          VERSION: ${{ steps.docs.outputs.version }}
        run: node scripts/publish.mjs build "${VERSION}"

  # A failed check or gate leaves no tag behind: the same version is tagged again after the fix.
  # After publish, the release stays; a failed job docs is rerun.
  withdraw:
    needs: [checks, gate, gate-plugin, gate-child-theme, gate-starter, publish]
    if: failure() && needs.publish.result != 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Delete the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/tags/${TAG}"
          echo "::error::The release failed, so the tag ${TAG} was deleted. Fix the cause and push the tag again."
