# Release pipeline of a consumer of the framework (a theme, child theme or plugin), reusable by its own workflow:
#
#   on:
#     push:
#       tags: ['v*']
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: SaijSaij/wp-app-framework/.github/workflows/consumer-release.yml@<framework tag>
#       with:
#         with-theme: SaijSaij/theme-dev-test@v1.0.0   # child themes (required) and plugins (optional) only
#
# Builds the release ZIP in the tools image of wp-test-env, installs it into fresh,
# plain WordPress instances of wp-test-env (release mode) and runs the consumer's
# browser tests (one Playwright worker per instance) and, with cli, its WP-CLI
# tests against them. Only if everything passes, the GitHub release of the tag gets the ZIP;
# if anything fails, the workflow deletes the tag (and a release created for it), so the
# same version can be tagged again once the cause is fixed.
# The repository name is the slug of the theme or plugin; the type in its
# composer.json (wordpress-theme, wordpress-plugin) and the Template: header of
# style.css (child themes) decide how it is installed. A child theme is tested on
# top of the release ZIP of its parent theme (input with-theme). A plugin is tested
# next to the release ZIP of a theme with with-theme, otherwise on the theme
# WordPress activates on installation (WP_DEFAULT_THEME, e.g. twentytwentyfive).
name: Consumer release

on:
  workflow_call:
    inputs:
      repository:
        description: 'Repository of the consumer (default: the calling repository).'
        type: string
        default: ''
      ref:
        description: 'Ref to build (default: the calling ref, i.e. the tag).'
        type: string
        default: ''
      e2e:
        description: Run the consumer's browser tests (npm script test:e2e) against the release.
        type: boolean
        default: true
      cli:
        description: Run the consumer's WP-CLI tests against the release, the executable tests/cli/run with the name of an instance of wp-test-env as argument (wp-test-env is checked out next to the consumer).
        type: boolean
        default: false
      publish:
        description: Attach the ZIP to the GitHub release of the tag; the tag must equal v<version> of style.css (theme, child theme) or of the main file <slug>.php (plugin).
        type: boolean
        default: true
      framework-ref:
        description: Build with this ref of wp-app-framework instead of the locked version (release gate of the framework).
        type: string
        default: ''
      wp-test-env-ref:
        description: Ref of SaijSaij/wp-test-env that provides the tools and the WordPress instances.
        type: string
        default: main
      e2e-instances:
        description: Number of WordPress instances (and Playwright workers) for the browser tests.
        type: number
        default: 2
      with-theme:
        description: 'Child themes (required) and plugins (optional) only: theme release whose ZIP the release test installs, as <owner>/<repository>@<tag>; for a child theme its parent theme. A plugin without it is tested on the default theme of WordPress.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      REPOSITORY: ${{ inputs.repository || github.repository }}
      REF: ${{ inputs.ref || github.ref }}
      # Composer reads GitHub repositories through the API; authenticated to avoid its rate limit.
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
    steps:
      - name: Determine slug and version
        id: project
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          slug="${REPOSITORY##*/}"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"
          if [[ "${PUBLISH}" == "true" ]]; then
            tag="${REF#refs/tags/}"
            if [[ ! "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?)$ ]]; then
              echo "::error::Releases are built from tags v<semantic version>, got ${REF}."
              exit 1
            fi
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the project
        uses: actions/checkout@v5
        with:
          repository: ${{ env.REPOSITORY }}
          ref: ${{ env.REF }}
          path: workspace/${{ steps.project.outputs.slug }}

      - name: Check out wp-test-env
        uses: actions/checkout@v5
        with:
          repository: SaijSaij/wp-test-env
          ref: ${{ inputs.wp-test-env-ref }}
          path: workspace/wp-test-env

      - name: Check out wp-app-framework
        if: inputs.framework-ref != ''
        uses: actions/checkout@v5
        with:
          repository: SaijSaij/wp-app-framework
          ref: ${{ inputs.framework-ref }}
          path: workspace/wp-app-framework

      - name: Determine the kind of the project
        id: kind
        env:
          SLUG: ${{ steps.project.outputs.slug }}
          WITH_THEME: ${{ inputs.with-theme }}
        run: |
          type="$(jq -r '.type // ""' "workspace/${SLUG}/composer.json")"
          needs_theme() {
            if [[ ! "${WITH_THEME}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[^@[:space:]]+$ ]]; then
              echo "::error::$1 ${SLUG} needs with-theme: <owner>/<repository>@<tag> of a theme release, got '${WITH_THEME}'."
              exit 1
            fi
          }
          case "${type}" in
            wordpress-theme)
              # Like get_file_data() of WordPress: a "Template:" header line in the first 8 KiB of style.css.
              if head -c 8192 "workspace/${SLUG}/style.css" | tr '\r' '\n' | grep -qiE '^([[:space:]]*<\?php)?[[:space:]/*#@]*Template:[[:space:]]*[^[:space:]*]'; then
                needs_theme 'Child theme'
                echo "kind=child-theme" >> "$GITHUB_OUTPUT"
              else
                if [[ -n "${WITH_THEME}" ]]; then
                  echo "::error::with-theme is only for plugins and child themes; ${SLUG} is a theme."
                  exit 1
                fi
                echo "kind=theme" >> "$GITHUB_OUTPUT"
              fi
              ;;
            wordpress-plugin)
              # Optional: without a theme release, the plugin runs on the default theme of WordPress.
              [[ -z "${WITH_THEME}" ]] || needs_theme 'Plugin'
              echo "kind=plugin" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::composer.json of ${SLUG} must declare the type wordpress-theme or wordpress-plugin, found '${type}'."
              exit 1
              ;;
          esac

      - name: Download the theme release
        id: theme
        if: inputs.with-theme != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WITH_THEME: ${{ inputs.with-theme }}
        run: |
          repository="${WITH_THEME%@*}"
          tag="${WITH_THEME##*@}"
          mkdir theme-release
          gh release download "${tag}" --repo "${repository}" --pattern '*.zip' --dir theme-release
          zips=(theme-release/*.zip)
          if [[ ${#zips[@]} -ne 1 || ! -f "${zips[0]}" ]]; then
            echo "::error::The release ${tag} of ${repository} must have exactly one ZIP, found ${#zips[@]}."
            exit 1
          fi
          echo "zip=$(realpath "${zips[0]}")" >> "$GITHUB_OUTPUT"

      - name: Build the images
        working-directory: workspace/wp-test-env
        run: bin/build

      - name: Install, lint and check the manifest
        working-directory: workspace/wp-test-env
        env:
          SLUG: ${{ steps.project.outputs.slug }}
          FRAMEWORK: ${{ inputs.framework-ref != '' }}
        run: |
          # With framework-ref the checked out framework also provides the build tools and the
          # editor runtime of the checkout (like the package links of bin/prepare).
          bin/tools -e COMPOSER_AUTH -e FRAMEWORK -w "${SLUG}" sh -euc "
            composer install --no-interaction --no-progress
            if [ \"\${FRAMEWORK}\" = true ]; then
              rm -r vendor/saij/wp-app-framework
              ln -s ../../../wp-app-framework vendor/saij/wp-app-framework
            fi
            if composer run-script --list | grep -q '^  lint '; then composer lint; else echo 'No composer lint script.'; fi
            npm ci --no-audit --no-fund
            npm run lint --if-present
            vendor/bin/wp-app-framework build
          "

      - name: Build the release
        id: build
        working-directory: workspace/wp-test-env
        env:
          SLUG: ${{ steps.project.outputs.slug }}
          VERSION: ${{ steps.project.outputs.version }}
          FRAMEWORK: ${{ inputs.framework-ref != '' }}
        run: |
          arguments=()
          if [[ -n "${VERSION}" ]]; then
            arguments+=("--expect-version=${VERSION}")
          fi
          if [[ "${FRAMEWORK}" == "true" ]]; then
            arguments+=("--package-source=saij/wp-app-framework=../wp-app-framework")
          fi
          bin/tools -e COMPOSER_AUTH -w "${SLUG}" vendor/bin/wp-app-framework release "${arguments[@]}"
          zip="$(find "../${SLUG}/dist" -maxdepth 1 -name "${SLUG}-*.zip" -print -quit)"
          echo "zip=$(realpath "${zip}")" >> "$GITHUB_OUTPUT"

      - name: Keep the release ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.project.outputs.slug }}-release
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

      - name: Install the release and run the CLI and browser tests
        id: e2e
        if: inputs.e2e || inputs.cli
        working-directory: workspace/wp-test-env
        env:
          SLUG: ${{ steps.project.outputs.slug }}
          ZIP: ${{ steps.build.outputs.zip }}
          THEME_ZIP: ${{ steps.theme.outputs.zip }}
          KIND: ${{ steps.kind.outputs.kind }}
          E2E: ${{ inputs.e2e }}
          E2E_INSTANCES: ${{ inputs.e2e-instances }}
          CLI_TESTS: ${{ inputs.cli }}
        run: |
          case "${KIND}" in
            plugin)
              zips=(--plugin-zip "${ZIP}")
              [[ -z "${THEME_ZIP}" ]] || zips=(--theme-zip "${THEME_ZIP}" "${zips[@]}")
              ;;
            child-theme) zips=(--theme-zip "${THEME_ZIP}" --child-theme-zip "${ZIP}") ;;
            *) zips=(--theme-zip "${ZIP}") ;;
          esac
          # Fresh instances with the release, started in parallel; the CLI tests get their own.
          e2e_instances=()
          instances=()
          if [[ "${E2E}" == "true" ]]; then
            for ((i = 1; i <= E2E_INSTANCES; i++)); do
              e2e_instances+=("release-${i}")
            done
            instances+=("${e2e_instances[@]}")
          fi
          if [[ "${CLI_TESTS}" == "true" ]]; then
            instances+=(release-cli)
          fi
          mkdir -p results
          pids=()
          for instance in "${instances[@]}"; do
            bin/up "${instance}" "${zips[@]}" > "results/up-${instance}.log" 2>&1 &
            pids+=($!)
          done
          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[i]}"; then
              echo "::error::Instance ${instances[i]} failed to start."
              cat "results/up-${instances[i]}.log"
              failed=1
            fi
          done
          if [[ "${failed}" != 0 ]]; then
            exit 1
          fi
          if [[ "${CLI_TESTS}" == "true" ]]; then
            "../${SLUG}/tests/cli/run" release-cli
          fi
          if [[ "${E2E}" == "true" ]]; then
            bin/e2e --instances "$(IFS=,; echo "${e2e_instances[*]}")" --project "${SLUG}" --results e2e
          fi

      # Only if the CLI or browser tests failed; an earlier failure leaves nothing to inspect.
      - name: Keep the test results
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.project.outputs.slug }}-e2e-results
          path: workspace/wp-test-env/results
          if-no-files-found: ignore

      - name: Logs of the WordPress instances
        if: failure() && steps.e2e.outcome == 'failure'
        working-directory: workspace/wp-test-env
        run: |
          for state in state/*/; do
            instance="$(basename "${state}")"
            echo "::group::${instance}"
            bin/logs "${instance}" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Attach the ZIP to the GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.project.outputs.tag }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          if gh release view "${TAG}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${ZIP}" --repo "${REPOSITORY}" --clobber
          else
            gh release create "${TAG}" "${ZIP}" --repo "${REPOSITORY}" --verify-tag --title "${TAG}" --generate-notes
          fi

      # A failed release leaves no tag behind: the same version is tagged again after the fix.
      - name: Withdraw the tag
        if: failure() && inputs.publish && steps.project.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.project.outputs.tag }}
        run: |
          if gh release view "${TAG}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            gh release delete "${TAG}" --repo "${REPOSITORY}" --cleanup-tag --yes
          else
            gh api --method DELETE "repos/${REPOSITORY}/git/refs/tags/${TAG}"
          fi
          echo "::error::The release failed, so the tag ${TAG} was deleted. Fix the cause and push the tag again."

